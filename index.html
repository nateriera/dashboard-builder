<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Builder</title>
  </head>
  <body>
    <header id="app-header">
      <div class="brand">
        <h1>Dashboard Builder</h1>
        <p class="brand-sub">Compose charts into dashboards</p>
      </div>
      <div class="header-actions">
        <button id="btn-data" type="button" title="Add CSV or JSON data">Add data</button>
        <button id="btn-charts" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="palette">Charts</button>
        <button id="btn-templates" type="button" title="Start from a template dashboard">Templates</button>
        <button id="btn-export-html" type="button" title="Download a self-contained HTML file of this dashboard">Export HTML</button>
        <button id="btn-more" type="button" aria-expanded="false" aria-controls="header-menu">More</button>
        <div id="header-menu" class="header-menu" role="group" aria-label="More dashboard actions" hidden>
          <button id="btn-theme" type="button" title="Pick a visual theme for the dashboard">Theme</button>
          <button id="btn-save" type="button" title="Save layout to this browser">Save layout</button>
          <button id="btn-export" type="button" title="Download layout as a JSON file">Export JSON</button>
          <button id="btn-import" type="button" title="Load a layout from a JSON file">Import JSON</button>
          <button id="btn-present" type="button" title="Hide the editor chrome and lock the grid">Present</button>
          <button id="btn-clear" type="button" class="danger" title="Remove all tiles">Clear grid</button>
        </div>
        <input type="file" id="file-import" accept="application/json,.json" hidden />
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </header>

    <div id="app-body">
      <div id="chart-backdrop" hidden></div>
      <aside id="palette" aria-label="Chart palette">
        <div class="palette-head">
          <h2>Charts</h2>
          <button id="btn-close-charts" type="button" aria-label="Close chart picker">×</button>
        </div>
        <div id="palette-items"></div>
        <p class="palette-hint">Drag a chart onto the grid, or click to add it.</p>
      </aside>

      <main id="grid-wrap">
        <div class="grid-stack" aria-label="Dashboard grid"></div>
      </main>
    </div>

    <button id="btn-exit-present" type="button" hidden>Exit present mode</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
